<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Magic</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Night Sky -->
<div class="sky">

<div class="moon"></div>

<div class="stars"></div>

</div>

<!-- Instruction -->
<div class="instruction">

Touch the Bow

</div>

<!-- Heart -->

<div id="heart">

<div class="heart"></div>

</div>

<!-- Bow -->

<div id="bow">

<svg width="130" height="220">

<path
d="M95 20
Q20 110
95 200"

stroke="#d89b54"
stroke-width="10"
fill="none"
stroke-linecap="round"/>

<line
x1="95"
y1="20"
x2="95"
y2="200"

stroke="white"
stroke-width="2"/>

</svg>

</div>

<!-- Arrow -->

<div id="arrow">

<svg width="150" height="20">

<line
x1="10"
y1="10"
x2="120"
y2="10"
stroke="#d0d0d0"
stroke-width="4"/>

<polygon
points="120,10 108,3 108,17"
fill="silver"/>

<polygon
points="10,10 22,4 22,16"
fill="#ff4444"/>

</svg>

</div>

<script src="script.js"></script>

</body>
</html>
